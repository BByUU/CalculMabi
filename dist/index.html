  <div class="workspace">
    <main id="main" tabindex="-1">
      <section class="settings-sidebar training-bonuses" aria-labelledby="settings-title">
        <div class="settings-heading"><h2 id="settings-title">修練加成</h2><div class="bonus-total"><span>合計倍率</span><strong id="combined-bonus">1<span>×</span></strong><span id="bonus-breakdown">次數 1× · 經驗值 1×</span></div></div>
        <div id="bonus-controls"></div>
      </section>

      <div class="training-overview">
      <section class="journey-card" aria-labelledby="journey-title">
        <div class="section-heading"><h2 id="journey-title">修練目標</h2><label class="training-goal-option" title="各階計算至 30 修練值；次數向上取整，已有修練值會先扣除。"><input id="train-to-30" type="checkbox">練到 30%</label><button id="reset" type="button" class="text-button">重設設定</button></div>
        <div class="journey-fields"><label>目前 Rank<select id="start-rank" aria-label="目前 Rank"><option>F</option></select></label><span class="journey-arrow" aria-hidden="true">→</span><label>目標 Rank<select id="target-rank" aria-label="目標 Rank"><option>1</option></select></label><label class="progress-field">目前 Rank 的修練值<div class="input-unit"><input id="current-progress" type="number" min="0" max="100" step="0.1" value="0"><span>/ 100</span></div></label></div>
        <p class="field-help">目標 Rank 為到達該階級；不包含目標階級本身的修練。</p>
      </section>
      <div id="error-message" class="error-message" role="alert" hidden></div>
      <section id="summary" class="summary-grid" aria-label="模擬結果" aria-live="polite"><article class="stat-card"><span>預估修練操作</span><strong>—<small>次</small></strong><p>依各項修練上限計算</p></article><article class="stat-card"><span>所需材料</span><strong>—<small>種</small></strong><p>依所選配方估算</p></article><article class="stat-card accent"><span>修練加成</span><strong>1<small>×</small></strong><p>次數倍率 × 經驗值倍率</p></article></section>
      </div>
      <section class="plan-section" aria-labelledby="plan-heading"><div class="section-heading"><h2 id="plan-heading">修練與材料消耗</h2><a class="materials-jump" href="#materials-heading">合計材料 ↓</a></div><div id="plan-panel"><div class="loading-state">正在整理技能資料…</div></div></section>
      <section class="training-materials" aria-labelledby="materials-heading"><h2 id="materials-heading">合計材料</h2><div id="materials-panel"></div></section>
      <footer class="data-footer"><p>修練成功率、遊戲版本及未列出的配方，可能影響實際需求。</p><details><summary>計算說明</summary><div id="method-notes"></div></details></footer>
